name: sdd-telemetry

x-app-env: &app-env
  NODE_ENV: production
  PORT: "4318"
  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"
  MYSQL_USER: ${MYSQL_USER:-sdd-telemetry}
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:-sdd-telemetry}
  MYSQL_DATABASE: ${MYSQL_DATABASE:-sdd-telemetry}
  MYSQL_CONNECTION_LIMIT: ${MYSQL_CONNECTION_LIMIT:-10}
  MYSQL_POOL_SIZE: ${MYSQL_POOL_SIZE:-10}
  MAX_OTLP_BODY_LIMIT: ${MAX_OTLP_BODY_LIMIT:-20mb}
  MAX_OTLP_PAYLOAD_BYTES: ${MAX_OTLP_PAYLOAD_BYTES:-5242880}
  MAX_OTLP_LOG_RECORDS: ${MAX_OTLP_LOG_RECORDS:-500}
  RAW_RETENTION_DAYS: ${RAW_RETENTION_DAYS:-7}
  EVENT_RETENTION_DAYS: ${EVENT_RETENTION_DAYS:-30}
  TEXT_RETENTION_DAYS: ${TEXT_RETENTION_DAYS:-30}
  AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:?AUTH_SESSION_SECRET is required}
  AUTH_SESSION_MAX_AGE_SECONDS: ${AUTH_SESSION_MAX_AGE_SECONDS:-604800}
  AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-1}
  SCHEDULE_CLEANING_INTERVAL_MS: ${SCHEDULE_CLEANING_INTERVAL_MS:-30000}
  SCHEDULE_CLEANING_BUDGET_MS: ${SCHEDULE_CLEANING_BUDGET_MS:-45000}
  SCHEDULE_CLEANING_LOCK_SECONDS: ${SCHEDULE_CLEANING_LOCK_SECONDS:-120}
  OPS_RESOURCE_POLL_INTERVAL_SECONDS: ${OPS_RESOURCE_POLL_INTERVAL_SECONDS:-30}
  OPS_RESOURCE_RETENTION_DAYS: ${OPS_RESOURCE_RETENTION_DAYS:-14}
  OPS_CPU_WARN_PERCENT: ${OPS_CPU_WARN_PERCENT:-80}
  OPS_MEMORY_WARN_PERCENT: ${OPS_MEMORY_WARN_PERCENT:-80}
  OPS_OUTBOX_FAILED_WARN: ${OPS_OUTBOX_FAILED_WARN:-1}
  OPS_OUTBOX_PENDING_WARN: ${OPS_OUTBOX_PENDING_WARN:-1000}
  COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-sdd-telemetry}
  DEPLOY_VERSION: ${DEPLOY_VERSION:-}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  KNOWLEDGE_BASE_ROOT: ${KNOWLEDGE_BASE_ROOT:-/knowledge}
  WIKI_CONTENT_MAX_BYTES: ${WIKI_CONTENT_MAX_BYTES:-524288}

services:
  mysql:
    image: mysql:8.4
    container_name: sdd-telemetry-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-sdd-telemetry-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sdd-telemetry}
      MYSQL_USER: ${MYSQL_USER:-sdd-telemetry}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-sdd-telemetry}
      TZ: UTC
    ports:
      - "${MYSQL_PUBLISHED_PORT:-3306}:3306"
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_0900_ai_ci"
      - "--max-allowed-packet=67108864"
      - "--max-connections=300"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u\"$${MYSQL_USER}\" -p\"$${MYSQL_PASSWORD}\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    image: ${SDD_TELEMETRY_APP_IMAGE:-sdd-telemetry-app:local}
    profiles: ["setup"]
    working_dir: /app/server
    environment: *app-env
    command: ["node", "dist/infrastructure/mysql/run-migrations.js"]
    depends_on:
      mysql:
        condition: service_healthy

  seed:
    image: ${SDD_TELEMETRY_APP_IMAGE:-sdd-telemetry-app:local}
    profiles: ["setup"]
    working_dir: /app/server
    environment: *app-env
    command: ["node", "dist/infrastructure/mysql/seed.js"]
    depends_on:
      mysql:
        condition: service_healthy

  server:
    image: ${SDD_TELEMETRY_APP_IMAGE:-sdd-telemetry-app:local}
    container_name: sdd-telemetry-server
    restart: unless-stopped
    working_dir: /app/server
    environment: *app-env
    command: ["node", "dist/bootstrap.js"]
    volumes:
      - ${KNOWLEDGE_BASE_HOST_DIR:-./knowledge}:/knowledge:ro
    ports:
      - "${API_PUBLISHED_PORT:-4318}:4318"
    depends_on:
      mysql:
        condition: service_healthy

  worker:
    image: ${SDD_TELEMETRY_APP_IMAGE:-sdd-telemetry-app:local}
    container_name: sdd-telemetry-worker
    restart: unless-stopped
    working_dir: /app/worker
    environment: *app-env
    command: ["node", "dist/main.js"]
    depends_on:
      mysql:
        condition: service_healthy

  ops-agent:
    image: ${SDD_TELEMETRY_APP_IMAGE:-sdd-telemetry-app:local}
    container_name: sdd-telemetry-ops-agent
    profiles: ["ops"]
    restart: unless-stopped
    working_dir: /app/worker
    environment: *app-env
    command: ["node", "dist/ops-resource-agent.js"]
    group_add:
      - "${DOCKER_SOCKET_GID:-999}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      mysql:
        condition: service_healthy

  web:
    image: ${SDD_TELEMETRY_WEB_IMAGE:-sdd-telemetry-web:local}
    container_name: sdd-telemetry-web
    restart: unless-stopped
    ports:
      - "${WEB_PUBLISHED_PORT:-8080}:80"
    depends_on:
      server:
        condition: service_started

volumes:
  mysql-data:
