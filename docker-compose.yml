services:
  mysql:
    image: mysql:8.4
    container_name: sdd-telemetry-mysql
    environment:
      MYSQL_ROOT_PASSWORD: sdd_monitor_root
      MYSQL_DATABASE: sdd_monitor
      MYSQL_USER: sdd_monitor
      MYSQL_PASSWORD: sdd_monitor
      TZ: UTC
    ports:
      - "3306:3306"
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_0900_ai_ci"
      - "--max-allowed-packet=67108864"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-usdd_monitor", "-psdd_monitor"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4
    container_name: sdd-telemetry-redis
    ports:
      - "46379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
