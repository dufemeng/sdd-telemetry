services:
  mysql:
    image: mysql:8.4
    container_name: sdd-telemetry-mysql
    environment:
      MYSQL_ROOT_PASSWORD: sdd-telemetry-root
      MYSQL_DATABASE: sdd-telemetry
      MYSQL_USER: sdd-telemetry
      MYSQL_PASSWORD: sdd-telemetry
      TZ: UTC
    ports:
      - "3306:3306"
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_0900_ai_ci"
      - "--max-allowed-packet=67108864"
      - "--max-connections=50"
      - "--innodb-buffer-pool-size=256M"
      - "--performance-schema=OFF"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-usdd-telemetry", "-psdd-telemetry"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
